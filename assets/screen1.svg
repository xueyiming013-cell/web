<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="60%" stop-color="#141822" />
      <stop offset="100%" stop-color="#07080b" />
    </linearGradient>
    <radialGradient id="moon-glow" cx="60%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#c5a059" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="crimson-slash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a" stop-opacity="0" />
      <stop offset="50%" stop-color="#ff3333" stop-opacity="1" />
      <stop offset="100%" stop-color="#990000" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="blade-glow" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffdddd" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />
  <circle cx="720" cy="200" r="350" fill="url(#moon-glow)" />

  <!-- Distant Pagodas & Mountain Silhouettes -->
  <path d="M-50 480 L120 380 L180 395 L250 330 L350 450 L500 360 L620 440 L800 310 L950 420 L1100 340 L1250 490 L1250 675 L-50 675 Z" fill="#0d0f14" opacity="0.8" />
  <path d="M150 380 L180 340 L210 380 Z" fill="#090a0d" />
  <path d="M780 310 L810 270 L840 310 Z" fill="#090a0d" />
  
  <!-- Rain Layers -->
  <g opacity="0.35" stroke="#cbd5e1" stroke-width="1.2">
    <line x1="100" y1="50" x2="80" y2="150" />
    <line x1="240" y1="20" x2="220" y2="120" />
    <line x1="400" y1="80" x2="380" y2="200" />
    <line x1="560" y1="40" x2="540" y2="160" />
    <line x1="720" y1="10" x2="700" y2="130" />
    <line x1="880" y1="60" x2="860" y2="180" />
    <line x1="1040" y1="30" x2="1020" y2="150" />
    <line x1="180" y1="220" x2="160" y2="340" />
    <line x1="340" y1="260" x2="320" y2="380" />
    <line x1="650" y1="210" x2="630" y2="330" />
    <line x1="820" y1="240" x2="800" y2="360" />
    <line x1="990" y1="200" x2="970" y2="320" />
    <line x1="1120" y1="280" x2="1100" y2="400" />
  </g>

  <!-- Ancient Timber Courtyard Stone Floor -->
  <path d="M0 520 L1200 520 L1200 675 L0 675 Z" fill="#11141c" />
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#c5a059" stroke-opacity="0.25" stroke-width="2" />
  <line x1="0" y1="580" x2="1200" y2="580" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Boss Silhouette (Lion Masked Brute) -->
  <g transform="translate(680, 260)">
    <!-- Ominous Red Eyes -->
    <circle cx="130" cy="120" r="5" fill="#ff2222" filter="drop-shadow(0 0 8px #ff0000)" />
    <circle cx="170" cy="118" r="5" fill="#ff2222" filter="drop-shadow(0 0 8px #ff0000)" />
    <!-- Lion Mane & Horns -->
    <path d="M50 160 Q150 40 250 160 Q280 230 240 300 L60 300 Q20 220 50 160 Z" fill="#181a20" stroke="#331010" stroke-width="3" />
    <!-- Massive Cleaver -->
    <path d="M220 180 L360 90 L390 120 L270 240 Z" fill="#2d3748" stroke="#718096" stroke-width="2" />
  </g>

  <!-- Protagonist Silhouette ('Soul' / 魂) -->
  <g transform="translate(260, 320)">
    <!-- Flowing Cloak in Rain -->
    <path d="M120 90 C80 120, 20 180, 0 250 C50 240, 100 235, 140 240 C130 180, 140 130, 120 90 Z" fill="#08090c" />
    <!-- Torso & Straw Rain Hat (斗笠) -->
    <ellipse cx="125" cy="75" rx="55" ry="12" fill="#1e2430" stroke="#c5a059" stroke-width="1.5" />
    <!-- Drawn Sword Arc -->
    <path d="M140 100 L260 40" stroke="url(#blade-glow)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Kinetic Combat Slash Arc -->
  <path d="M380 430 Q580 260 760 380" fill="none" stroke="url(#crimson-slash)" stroke-width="14" stroke-linecap="round" filter="drop-shadow(0 0 15px #ff0000)" />
  <path d="M400 420 Q580 280 740 375" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Blood & Rain Droplet Sparks -->
  <circle cx="560" cy="310" r="3" fill="#ff3333" />
  <circle cx="585" cy="295" r="2" fill="#ff8888" />
  <circle cx="610" cy="330" r="4" fill="#ff1111" />
  <circle cx="530" cy="340" r="2.5" fill="#ffffff" />

  <!-- Calligraphic / UI Title Overlay -->
  <text x="60" y="90" font-family="'Cinzel', serif" font-weight="900" font-size="28" fill="#c5a059" letter-spacing="4">ACT I : THE RAINBLOOD DUEL</text>
  <text x="60" y="125" font-family="'Noto Serif KR', serif" font-weight="600" font-size="18" fill="#e2e8f0" opacity="0.85">폭우 속의 사자탈 수령과의 진검승부 · 谷垣健治 무술 안무 실사 연출</text>
</svg>

