<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="fire-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="steam-cloud" cx="40%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#64748b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#0d0e12" />

  <!-- Industrial Gear Wheels in Background -->
  <g transform="translate(850, 200)" opacity="0.15">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#c5a059" stroke-width="12" stroke-dasharray="25, 10" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#c5a059" stroke-width="6" />
    <circle cx="0" cy="0" r="30" fill="#c5a059" />
  </g>
  <g transform="translate(1000, 380)" opacity="0.12">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#c5a059" stroke-width="10" stroke-dasharray="20, 8" />
  </g>

  <!-- Steam Clouds -->
  <circle cx="500" cy="350" r="180" fill="url(#steam-cloud)" />
  <circle cx="700" cy="320" r="220" fill="url(#steam-cloud)" />

  <!-- Steampunk Arm Weapon & Flamethrower Blast -->
  <g transform="translate(250, 320)">
    <!-- Arm Prosthetic Mechanics -->
    <rect x="0" y="20" width="160" height="45" rx="8" fill="#1e222d" stroke="#c5a059" stroke-width="2" />
    <circle cx="60" cy="42" r="14" fill="#333b4d" stroke="#c5a059" stroke-width="2" />
    <!-- Lion Head Cannon Muzzle -->
    <path d="M150 0 L240 10 L250 75 L150 85 Z" fill="#2d1515" stroke="#dc2626" stroke-width="2.5" />
    <!-- Lion Teeth & Ornaments -->
    <path d="M240 15 L260 25 L240 35 L260 45 L240 55 L260 65 L240 75" fill="none" stroke="#c5a059" stroke-width="3" />
    <!-- Cannon Blast Cone -->
    <path d="M260 42 L750 0 L850 90 L260 45 Z" fill="url(#fire-grad)" opacity="0.85" />
    <path d="M260 42 L650 20 L720 70 L260 45 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Fire Particles & Embers -->
  <g fill="#fef08a">
    <circle cx="600" cy="280" r="4" />
    <circle cx="680" cy="320" r="5" />
    <circle cx="750" cy="260" r="3" />
    <circle cx="820" cy="340" r="4.5" />
    <circle cx="910" cy="310" r="3" />
    <circle cx="960" cy="370" r="2.5" />
  </g>

  <!-- Titles -->
  <text x="60" y="90" font-family="'Cinzel', serif" font-weight="900" font-size="28" fill="#c5a059" letter-spacing="4">ACT II : ARSENAL & KUNGFUPUNK</text>
  <text x="60" y="125" font-family="'Noto Serif KR', serif" font-weight="600" font-size="18" fill="#e2e8f0" opacity="0.85">호효 사자포와 기계 의수 · 전통 무협과 스팀펑크 병기의 융합</text>
</svg>

